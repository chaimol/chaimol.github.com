<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基因ID转换</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f9fc;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 2.8rem;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 4px;
            background: linear-gradient(to right, #3498db, #2ecc71);
            border-radius: 2px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.2rem;
            max-width: 700px;
            margin: 20px auto 0;
            line-height: 1.7;
        }
        
        .species-selection {
            text-align: center;
            margin-bottom: 50px;
        }
        
        h2 {
            color: #34495e;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        
        .species-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }
        
        .species-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-decoration: none;
        }
        
        .species-circle:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .species-circle:active {
            transform: translateY(-5px) scale(1.02);
        }
        
        .species-image {
            width: 100px;
            height: 100px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .species-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.1rem;
            text-align: center;
        }
        
        .species-count {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        .instructions {
            background-color: white;
            border-radius: 15px;
            padding: 25px 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-top: 50px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .instructions h3 {
            color: #3498db;
            margin-bottom: 15px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .instructions p {
            margin-bottom: 15px;
            color: #555;
        }
        
        .step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #eee;
        }
        
        .step:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .step-number {
            background-color: #3498db;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #95a5a6;
            font-size: 0.9rem;
        }
        
        .github-section {
            text-align: center;
            margin-top: 20px;
        }
        
        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .github-link:hover {
            color: #3498db;
        }
        
        .github-stats {
            display: inline-flex;
            gap: 15px;
            margin-top: 8px;
        }
        
        .github-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f8f9fa;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .species-circle:hover .loading {
            opacity: 1;
        }
        
        /* 自定义图标样式 */
        .cotton-icon {
            color: #3498db;
            position: relative;
        }
        
        .cotton-icon::before {
            content: "❀";
            font-size: 3.5rem;
        }
        
        .maize-icon {
            color: #e74c3c;
            position: relative;
        }
        
        .maize-icon::before {
            content: "🌽";
            font-size: 3.5rem;
        }
        
        @media (max-width: 768px) {
            .species-grid {
                gap: 25px;
            }
            
            .species-circle {
                width: 150px;
                height: 150px;
            }
            
            .species-image {
                width: 80px;
                height: 80px;
            }
            
            .cotton-icon::before, .maize-icon::before {
                font-size: 2.8rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
        
        @media (max-width: 480px) {
            .species-grid {
                gap: 20px;
            }
            
            .species-circle {
                width: 130px;
                height: 130px;
            }
            
            .species-image {
                width: 70px;
                height: 70px;
            }
            
            .cotton-icon::before, .maize-icon::before {
                font-size: 2.4rem;
            }
            
            .species-name {
                font-size: 1rem;
            }
            
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
                padding: 0 10px;
            }
            
            .instructions {
                padding: 15px 20px;
                margin: 30px 10px 0;
            }
            
            .instructions h3 {
                font-size: 1.2rem;
            }
        }
        
        /* 新增：更小屏幕尺寸的适配 */
        @media (max-width: 360px) {
            .species-grid {
                gap: 15px;
            }
            
            .species-circle {
                width: 110px;
                height: 110px;
            }
            
            .species-image {
                width: 60px;
                height: 60px;
            }
            
            .cotton-icon::before, .maize-icon::before {
                font-size: 2rem;
            }
            
            .species-name {
                font-size: 0.9rem;
            }
            
            .species-count {
                font-size: 0.75rem;
            }
            
            h1 {
                font-size: 1.6rem;
            }
        }
        
        /* 触摸设备优化 */
        @media (hover: none) and (pointer: coarse) {
            .species-circle:hover {
                transform: scale(1.05); /* 移除 translateY 效果，更适合触摸设备 */
            }
            
            .species-circle:active {
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>基因ID转换</h1>
            <p class="subtitle">选择目标物种，进行基因标识符的转换和映射。支持不同数据库间的基因ID转换。</p>
        </header>
        
        <main>
            <section class="species-selection">
                <p>点击下方物种图标进入对应的基因ID转换页面</p>
                
                <div class="species-grid">
                    <!-- 棉花 -->
                    <a href="cotton.html" target="_blank" class="species-circle" id="cotton">
                        <div class="species-image">
                            <div class="cotton-icon"></div>
                        </div>
                        <div class="species-name">棉花</div>
                        <div class="species-count">四倍体约6-8万个基因</div>
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin fa-2x" style="color: #3498db;"></i>
                        </div>
                    </a>
                    
                    <!-- 玉米 -->
                    <a href="maize.html" target="_blank" class="species-circle" id="maize">
                        <div class="species-image">
                            <div class="maize-icon"></div>
                        </div>
                        <div class="species-name">玉米</div>
                        <div class="species-count">约3-4万个基因</div>
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin fa-2x" style="color: #e74c3c;"></i>
                        </div>
                    </a>
                </div>
            </section>
        </main>
        
        <footer>
            <p>基因ID转换工具 &copy; chaimol | 支持物种: 棉花、玉米</p>
            <p>数据来源: Ensembl, cottongen, maizegdb</p>
            <div class="github-section">
                <a href="https://github.com/chaimol/chaimol.github.com/tree/master/product/IDconvert/" target="_blank" class="github-link">
                    <i class="fab fa-github"></i>
                    查看项目源代码
                </a>
                <div class="github-stats">
                    <span id="github-stars" class="github-stat">
                        <i class="fas fa-star"></i>
                        <span>加载中...</span>
                    </span>
                    <span id="github-forks" class="github-stat">
                        <i class="fas fa-code-branch"></i>
                        <span>加载中...</span>
                    </span>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // 获取GitHub仓库统计数据
        async function fetchGithubStats() {
            try {
                // 注意：由于CORS限制，直接从浏览器请求GitHub API可能失败
                // 这里提供了一个替代方案，使用JSONP或后端代理
                const repo = 'chaimol/chaimol.github.com'; // 假设这是正确的仓库名
                
                // 使用fetch API获取仓库信息
                const response = await fetch(`https://api.github.com/repos/${repo}`);
                const data = await response.json();
                
                if(data.stargazers_count !== undefined && data.forks_count !== undefined) {
                    document.getElementById('github-stars').querySelector('span').textContent = data.stargazers_count;
                    document.getElementById('github-forks').querySelector('span').textContent = data.forks_count;
                }
            } catch (error) {
                // 如果API请求失败，隐藏统计信息或显示错误
                document.querySelector('.github-stats').style.display = 'none';
                console.error('获取GitHub统计信息失败:', error);
            }
        }
        
        // 页面加载完成后获取GitHub统计信息
        document.addEventListener('DOMContentLoaded', fetchGithubStats);
        
        // 添加点击效果和页面跳转模拟
        document.querySelectorAll('.species-circle').forEach(circle => {
            circle.addEventListener('click', function(e) {
                // 添加点击效果
                this.style.transform = 'scale(0.95)';
                
                // 模拟加载延迟
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
                
                // 在实际应用中，这里会跳转到对应页面
                // 由于是示例，我们只显示提示信息
                const speciesName = this.querySelector('.species-name').textContent;
                console.log(`正在跳转到${speciesName}的基因ID转换页面...`);
            });
        });
        
        // 添加键盘导航支持
        document.addEventListener('keydown', function(e) {
            const circles = document.querySelectorAll('.species-circle');
            let currentIndex = -1;
            
            // 检查当前焦点是否在某个圆圈上
            circles.forEach((circle, index) => {
                if (circle === document.activeElement) {
                    currentIndex = index;
                }
            });
            
            // 处理方向键导航
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                const nextIndex = (currentIndex + 1) % circles.length;
                circles[nextIndex].focus();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                const prevIndex = (currentIndex - 1 + circles.length) % circles.length;
                circles[prevIndex].focus();
            }
        });
    </script>
</body>
</html>

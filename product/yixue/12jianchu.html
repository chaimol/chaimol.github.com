        // 降级方案：使用缓存
        const y = date.getFullYear();
        const m = date.getMonth() + 1;
        const d = date.getDate();
        const key = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        
        // 第一步：尝试从缓存中查找当天是否为节气日
        if(solarTermDB[key]) {
            const term = solarTermDB[key];
            return JIE_QI_TO_BRANCH[term] || "寅";
        }
        
        // 第二步：尝试从缓存中查找前一个最近的节气
        let prevTermDate = null;
        let prevTerm = null;
        for(let [dt, term] of Object.entries(solarTermDB)) {
            let dtDate = new Date(dt);
            if(dtDate <= date && JIE_QI_TO_BRANCH[term]) {
                if(!prevTermDate || dtDate > prevTermDate) {
                    prevTermDate = dtDate;
                    prevTerm = term;
                }
            }
        }
        
        if(prevTerm) {
            return JIE_QI_TO_BRANCH[prevTerm];
        }
        
        // 第三步：降级方案 - 根据月份简单估算
        if(m===1) return d < 5 ? "子" : "丑";
        if(m===2) return d < 4 ? "丑" : "寅";
        if(m===3) return d < 5 ? "寅" : "卯";
        if(m===4) return d < 4 ? "卯" : "辰";
        if(m===5) return d < 5 ? "辰" : "巳";
        if(m===6) return d < 5 ? "巳" : "午";
        if(m===7) return d < 6 ? "午" : "未";
        if(m===8) return d < 7 ? "未" : "申";
        if(m===9) return d < 7 ? "申" : "酉";
        if(m===10) return d < 8 ? "酉" : "戌";
        if(m===11) return d < 7 ? "戌" : "亥";
        if(m===12) return d < 6 ? "亥" : "子";
        return "寅";
    }
    
    // 根据公历日期计算建除十二神 (日支关系与月建)
    function getJianChu(date) {
        // 获取月建地支
        const monthBranch = getMonthBranchFromDate(date);
        // 获取日地支（使用 lunar.js）
        const dayBranch = getDayBranchFromLunar(date);
        const branchOrder = { "寅":0,"卯":1,"辰":2,"巳":3,"午":4,"未":5,"申":6,"酉":7,"戌":8,"亥":9,"子":10,"丑":11 };
        const monthIdx = branchOrder[monthBranch];
        const dayIdx = branchOrder[dayBranch];
        // 建除 起始: 月建日对应 "建", 第二天除, 第三天满... 循环12
        const offset = (dayIdx - monthIdx + 12) % 12;
        return JIANCHU_NAMES[offset];
    }
    
    // 使用 lunar.js 获取日地支
    function getDayBranchFromLunar(date) {
        try {
            if (typeof Solar !== 'undefined') {
                const solar = Solar.fromYmdHms(
                    date.getFullYear(),
                    date.getMonth() + 1,
                    date.getDate(),
                    date.getHours(),
                    date.getMinutes(),
                    date.getSeconds()
                );
                const lunar = solar.getLunar();
                
                // 获取日地支
                const dayZhi = lunar.getDayZhi();
                
                console.log("日地支:", dayZhi);
                
                return dayZhi;
            }
        } catch (e) {
            console.warn("lunar.js 计算日支失败，使用降级方案:", e);
        }
        
        // 降级方案：使用已验证的基准日期
        const baseDate = new Date(2000,0,1);
        const diff = Math.floor((date - baseDate) / (24*3600*1000));
        const zhiList = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        const zhiIndex = (diff + 6) % 12;
        return zhiList[zhiIndex];
    }
    
    // 根据日干支求黄道黑道十二星君 (遁月起日法)
    function getXingJun(date) {
        const dayBranch = getDayBranchFromLunar(date);
        const monthBranch = getMonthBranchFromDate(date);
        
        // 根据地支获取索引
        const branchOrder = {"子":0,"丑":1,"寅":2,"卯":3,"辰":4,"巳":5,"午":6,"未":7,"申":8,"酉":9,"戌":10,"亥":11};
        
        // 根据月建确定青龙起始日
        let qinglongStart;
        switch(monthBranch) {
            case "子":
            case "午":
                qinglongStart = "申"; // 子午月申日起青龙
                break;
            case "卯":
            case "酉":
                qinglongStart = "寅"; // 卯酉月寅日起青龙
                break;
            case "寅":
            case "申":
                qinglongStart = "子"; // 寅申月子日起青龙
                break;
            case "巳":
            case "亥":
                qinglongStart = "午"; // 巳亥月午日起青龙
                break;
            case "辰":
            case "戌":
                qinglongStart = "辰"; // 辰戌月辰日起青龙
                break;
            case "丑":
            case "未":
                qinglongStart = "戌"; // 丑未月戌日起青龙
                break;
            default:
                qinglongStart = "子"; // 默认
        }
        
        // 计算从青龙起始日到当前日支的偏移
        const startIdx = branchOrder[qinglongStart];
        const dayIdx = branchOrder[dayBranch];
        const offset = (dayIdx - startIdx + 12) % 12;
        
        // 星君顺序：青龙、明堂、天刑、朱雀、金匮、天德、白虎、玉堂、天牢、玄武、司命、勾陈
        return XINGJUN_NAMES[offset];
    }
   
    // 根据建除+黄道星君提供简单的宜忌汇总
    function getYiJiSummary(jianchu, xingjun) {
        // 传统原则: 建除中 除、定、执、成、开 吉； 破、闭、危 凶； 满平收建中平偏吉。
        let yiList = [];
        let jiList = [];
        // 建除优先宜忌参考古籍
        const jianMap = {
            "建": ["修造", "动土", "祭祀"], "除": ["扫除", "嫁娶", "治病"], "满": ["祭祀", "纳财", "祈福"],
            "平": ["修造", "平道", "涂泥"], "定": ["安床", "签约", "祈福"], "执": ["捕捉", "修缮"],
            "破": [], "危": ["祈福", "斋醮"], "成": ["结婚", "开业", "入学", "上任"], "收": ["嫁娶", "纳财", "收藏"],
            "开": ["开市", "嫁娶", "出行", "纳财"], "闭": ["筑堤", "补垣", "塞穴"]
        };
        const jianJi = {
            "建": ["嫁娶", "开仓"], "除": ["丧葬", "破土"], "满": ["安葬", "上任"], "平": ["结婚", "开市"],
            "定": ["诉讼", "开市"], "执": ["嫁娶", "搬迁"], "破": ["诸事不宜", "嫁娶", "开市", "动土"], 
            "危": ["登高", "渡水"], "成": ["诉讼", "安葬"], "收": ["行丧", "安葬"], "开": ["安葬", "破土"], 
            "闭": ["嫁娶", "开光", "远行"]
        };
        if(jianMap[jianchu]) yiList.push(...jianMap[jianchu]);
        if(jianJi[jianchu]) jiList.push(...jianJi[jianchu]);
        // 根据星君增补
        if(xingjun === "青龙" || xingjun === "明堂" || xingjun === "金匮" || xingjun === "天德" || xingjun === "玉堂" || xingjun === "司命") {
            yiList.push("签约", "会友", "祈福");
        } else {
            jiList.push("嫁娶", "开市", "赴任");
        }
        if(xingjun === "朱雀") jiList.push("口舌忌诉讼");
        if(xingjun === "白虎") jiList.push("出行忌血光");
        if(jianchu === "破") jiList = ["百事不宜", "忌嫁娶", "忌动土"];
        yiList = [...new Set(yiList.filter(s=>s))].slice(0,6);
        jiList = [...new Set(jiList.filter(s=>s))].slice(0,6);
        if(yiList.length===0) yiList.push("常规小事");
        if(jiList.length===0) jiList.push("无大忌, 详查神煞");
        return { yiList, jiList };
    }
    
    // 更新UI
    function updateByDate(date) {
        const jianchu = getJianChu(date);
        const xingjun = getXingJun(date);
        const branchDay = getDayBranchFromLunar(date);
        const monthBranch = getMonthBranchFromDate(date);
        const { yiList, jiList } = getYiJiSummary(jianchu, xingjun);
        
        // 获取吉凶类型和建议
        const jixiong = JIANCHU_JIXIONG[jianchu] || "平";
        const advice = JIANCHU_ADVICE[jianchu] || "";
        
        document.getElementById("jianchuName").innerText = jianchu;
        document.getElementById("jianchuDesc").innerHTML = `
            <div style="margin-bottom:8px;">${JIANCHU_DESC[jianchu] || "吉凶参半"}</div>
            <div style="background:#fff3e0; border-left:3px solid #ff9800; padding:8px 12px; border-radius:8px; font-size:0.85rem; color:#e65100;">
                ${advice}
            </div>
        `;
        document.getElementById("xingjunName").innerHTML = `${xingjun} (${branchDay}日)`;
        document.getElementById("xingjunType").innerHTML = XINGJUN_TYPE[xingjun] || "星君值日";
        document.getElementById("xingjunDesc").innerHTML = XINGJUN_DESC[xingjun] || "诸事酌之";
        
        const yiHtml = yiList.map(t => `<span class="yi-tag">宜 ${t}</span>`).join('');
        const jiHtml = jiList.map(t => `<span class="ji-tag">忌 ${t}</span>`).join('');
        document.getElementById("yiList").innerHTML = yiHtml || '<span class="yi-tag">宜 常规善事</span>';
        document.getElementById("jiList").innerHTML = jiHtml || '<span class="ji-tag">忌 大事不宜</span>';
        
        const explainDiv = document.getElementById("detailExplain");
        explainDiv.innerHTML = `
            <strong>📅 本月建为「${monthBranch}月」，日支「${branchDay}」。</strong><br>
            建除十二神轮至「<strong>${jianchu}</strong>」日，${JIANCHU_DESC[jianchu] || ''}<br>
            又逢「<strong>${xingjun}</strong>」星君值日，${XINGJUN_DESC[xingjun] || '须结合具体事项择吉'}。<br>
            <div style="margin-top:10px; padding:10px; background:#f5f5f5; border-radius:8px;">
                <strong>🔮 口诀判断：</strong>${jixiong}<br>
                <small>依据：建满平收黑，除危定执黄，成开皆可用，破闭不可当</small>
            </div>
        `;
        
        // 显示十二建除循环图
        const monthIdx = BRANCHES.indexOf(monthBranch);
        const dayIdxCurr = ["寅","卯","辰","巳","午","未","申","酉","戌","亥","子","丑"].indexOf(branchDay);
        let startOffset = (dayIdxCurr - monthIdx + 12)%12;
        let gridHtml = '';
        for(let i=0; i<12; i++) {
            let jc = JIANCHU_NAMES[(startOffset + i)%12];
            let isCurrent = (jc === jianchu);
            let jixiongClass = '';
            if (['成', '开'].includes(jc)) jixiongClass = 'style="background:#c8e6c9;"';
            else if (['破', '闭'].includes(jc)) jixiongClass = 'style="background:#ffcdd2;"';
            else if (['除', '危', '定', '执'].includes(jc)) jixiongClass = 'style="background:#fff9c4;"';
            
            gridHtml += `<div class="twelve-item ${isCurrent ? 'current-jc' : ''}" ${jixiongClass}>${jc}</div>`;
        }
        document.getElementById("twelveCycleGrid").innerHTML = gridHtml;
        document.getElementById("displayDate").innerHTML = `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`;
    }
    
    // 初始化与监听
    const picker = document.getElementById("datePicker");
    const btn = document.getElementById("queryBtn");
    
    function loadDateFromPicker() {
        let dateStr = picker.value;
        if(!dateStr) dateStr = "2026-06-04";
        const date = new Date(dateStr);
        if(!isNaN(date.getTime())) updateByDate(date);
        else updateByDate(new Date());
    }
    
    btn.addEventListener("click", loadDateFromPicker);
    window.addEventListener("DOMContentLoaded", ()=>{
        // 默认今天
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth()+1).padStart(2,'0');
        const dd = String(today.getDate()).padStart(2,'0');
        picker.value = `${yyyy}-${mm}-${dd}`;
        loadDateFromPicker();
    });
</script>

<script src="lunar.min.js"></script>
<script>
    // ======================= 1. 基础数据：生肖、干支、大利月映射 ======================
    const zodiacs = ["鼠", "牛", "虎", "兔", "龙", "蛇", "马", "羊", "猴", "鸡", "狗", "猪"];
    function getZodiacByYear(lunarYear) {
        if (lunarYear < 1900) lunarYear = 1900;
        let offset = (lunarYear - 1900) % 12;
        return zodiacs[offset];
    }
    // 大利月映射,均是农历月份
    //口诀：正七迎鸡兔，二八虎与猴，三九蛇共猪，四十龙和狗，牛羊五十一，鼠马六十二
    const daLiMap = {
        "鼠": [6,12], "牛": [5,11], "虎": [2,8], "兔": [1,7], "龙": [4,10], "蛇": [3,9],
        "马": [6,12], "羊": [5,11], "猴": [2,8], "鸡": [1,7], "狗": [4,10], "猪": [3,9]
    };
    // 小利月映射，均是农历月份
    //子鼠(1)丑牛(2)寅虎(3)卯兔(4)辰龙(5)巳蛇(6)午马(7)未羊(8)申猴(9)酉鸡(10)戌狗(11)亥猪(12)
    const xiaoLiMap = {
        "鼠": [1,7], "牛": [4,10], "虎": [3,9], "兔": [6,12], "龙": [5,11], "蛇": [2,8],
        "马": [1,7], "羊": [4,10], "猴": [3,9], "鸡": [6,12], "狗": [5,11], "猪": [2,8]
    };
    // 属相冲口诀：鼠马、牛羊、虎猴、兔鸡、龙狗、蛇猪，很简单的计算方法就是年龄相差6+12*n的岁数相冲。6,18,24依次类推
    const liuChong = {
        "鼠":"马","牛":"羊","虎":"猴","兔":"鸡","龙":"狗","蛇":"猪",
        "马":"鼠","羊":"牛","猴":"虎","鸡":"兔","狗":"龙","猪":"蛇"
    };
    //属相三合 口诀：猴鼠龙、猪兔羊、虎马狗、蛇鸡牛
    const sanHe = {
        "鼠":["猴","龙"], "牛":["蛇","鸡"], "虎":["马","狗"], "兔":["猪","羊"],
        "龙":["鼠","猴"], "蛇":["鸡","牛"], "马":["虎","狗"], "羊":["猪","兔"],
        "猴":["鼠","龙"], "鸡":["蛇","牛"], "狗":["虎","马"], "猪":["兔","羊"]
    };
    //属相六合 口诀：鼠牛、虎猪、兔狗、龙鸡、蛇猴、马羊 
    const liuHe = {
        "鼠":"牛","牛":"鼠","虎":"猪","猪":"虎","兔":"狗","狗":"兔","龙":"鸡","鸡":"龙","蛇":"猴","猴":"蛇","马":"羊","羊":"马"
    };
    
    // 男方禁婚年（根据男方生肖）口诀是：男命禁婚年，太岁前五辰
    // 传统规则：
    // "太岁前五辰"指从男方生肖地支往前数5个位置为禁婚年
    // 地支顺序：子(1)丑(2)寅(3)卯(4)辰(5)巳(6)午(7)未(8)申(9)酉(10)戌(11)亥(12)
    const maleForbiddenYears = {
        "鼠": [8],      // 子年生人：子(1)往前5位是未(8) 
        "牛": [9],      // 丑年生人
        "虎": [10],      // 寅年生人
        "兔": [11],      // 卯年生人
        "龙": [12],      // 辰年生人
        "蛇": [1],      // 巳年生人
        "马": [2],     // 午年生人
        "羊": [3],     // 未年生人
        "猴": [4],     // 申年生人
        "鸡": [5],      // 酉年生人
        "狗": [6],      // 戌年生人
        "猪": [7]       // 亥年生人
    };
    // 地支顺序：子(1)、丑(2)、寅(3)、卯(4)、辰(5)、巳(6)、午(7)、未(8)、申(9)、酉(10)、戌(11)、亥(12)
    // 计算公式：禁婚年地支序号 = (生肖地支序号 - 5 + 12)
    //地支与农历月份对应：寅=1月、卯=2月、辰=3月、巳=4月、午=5月、未=6月、申=7月、酉=8月、戌=9月、亥=10月、子=11月、丑=12月
    
    // 婚嫁三煞
    // 三煞：劫煞、灾煞、岁煞，注意这个是婚嫁择日中的本命三杀日和方位三煞不同。不要混淆。
    //婚嫁三煞口诀：巳午未，忌申子辰；申酉戌，忌亥卯未；亥子丑，忌寅午戌；寅卯辰，忌巳酉丑
    const benMingSanSha = {//生肖：对应的三煞日
        "子": ["寅", "午", "戌"],  // 鼠：虎马狗（亥子丑年忌寅午戌）
        "丑": ["寅", "午", "戌"],  // 牛：虎马狗（亥子丑年忌寅午戌）
        "寅": ["巳", "酉", "丑"],  // 虎：蛇鸡牛（寅卯辰年忌巳酉丑）
        "卯": ["巳", "酉", "丑"],  // 兔：蛇鸡牛（寅卯辰年忌巳酉丑）
        "辰": ["巳", "酉", "丑"],  // 龙：蛇鸡牛（寅卯辰年忌巳酉丑）
        "巳": ["申", "子", "辰"],  // 蛇：猴鼠龙（巳午未年忌申子辰）
        "午": ["申", "子", "辰"],  // 马：猴鼠龙（巳午未年忌申子辰）
        "未": ["申", "子", "辰"],  // 羊：猴鼠龙（巳午未年忌申子辰）
        "申": ["亥", "卯", "未"],  // 猴：猪兔羊（申酉戌年忌亥卯未）
        "酉": ["亥", "卯", "未"],  // 鸡：猪兔羊（申酉戌年忌亥卯未）
        "戌": ["亥", "卯", "未"],  // 狗：猪兔羊（申酉戌年忌亥卯未）
        "亥": ["寅", "午", "戌"]   // 猪：虎马狗（亥子丑年忌寅午戌）
    };
    
    // 本命三煞（根据年支确定三煞方位和日期）
    // 三煞：劫煞、灾煞、岁煞，注意这个是婚嫁择日中的本命三杀日和方位三煞不同。不要混淆。
    //本命三煞口诀：申子辰，杀在未；亥卯未，杀在戌；寅午戌，杀在丑；巳酉丑，杀在辰
    //本命三杀是不能在对应的方位动土
    const fangweiSanSha = {//生肖：对应的三煞方位
        "子": ["未", "巳", "午"],  // 鼠：蛇马羊
        "丑": ["亥", "子", "丑"],  // 牛：猪鼠牛
        "寅": ["申", "酉", "戌"],  // 虎：猴鸡狗
        "卯": ["巳", "午", "未"],  // 兔：蛇马羊
        "辰": ["寅", "卯", "辰"],  // 龙：虎兔龙
        "巳": ["亥", "子", "丑"],  // 蛇：猪鼠牛
        "午": ["申", "酉", "戌"],  // 马：猴鸡狗
        "未": ["巳", "午", "未"],  // 羊：蛇马羊
        "申": ["寅", "卯", "辰"],  // 猴：虎兔龙
        "酉": ["亥", "子", "丑"],  // 鸡：猪鼠牛
        "戌": ["申", "酉", "戌"],  // 狗：猴鸡狗
        "亥": ["巳", "午", "未"]   // 猪：蛇马羊
    };
     // ===================== 综合打分系统核心函数 =====================
    
    // 获取节气月索引（用于紫白和不将日计算）
    function getJieQiMonthIndex(year, month, day) {
        try {
            if (typeof Solar !== 'undefined' && typeof Solar.fromYmdHms === 'function') {
                const solar = Solar.fromYmdHms(year, month, day, 12, 0, 0);
                const lunar = solar.getLunar();
                const monthInGanZhi = lunar.getMonthInGanZhi();
                
                const zhiToMonth = {
                    "寅": 1, "卯": 2, "辰": 3, "巳": 4, "午": 5, "未": 6,
                    "申": 7, "酉": 8, "戌": 9, "亥": 10, "子": 11, "丑": 12
                };
                
                const zhi = monthInGanZhi.charAt(1);
                return zhiToMonth[zhi] || 1;
            }
        } catch (e) {
            console.warn("获取节气月失败:", e);
        }
        return 1;
    }
    
    // 判断是否为不将日
    function isBuJiangDay(lunarInfo) {
        const lunarMonthIdx = lunarInfo.jieQiMonthIndex;
        if(lunarMonthIdx === 0) return false;
        
        const bujiangTable = getBujiangTableByMonth(lunarMonthIdx);
        const ganzhiStr = lunarInfo.dayGan + lunarInfo.dayZhi;
        return bujiangTable.includes(ganzhiStr);
    }
    
    // 获取每月不将日表
    function getBujiangTableByMonth(monthIdx) {
        const tables = {
            1: ["辛丑","辛卯","庚子","庚寅","丁丑","丁卯","丙子","丙寅","戊子","戊寅"],
            2: ["庚子","庚寅","庚戌","丁丑","丙子","丙戌","丙寅","乙丑","戊子","戊寅"],
            3: ["丁丑","丙戌","丙子","乙酉","乙丑","甲戌","甲子","戊子"],

    // 获取建除十二神
    function getJianChu(lunarInfo) {
        const monthZhi = lunarInfo.monthZhi;
        const dayBranch = lunarInfo.dayZhi;
        const order = {"寅":0,"卯":1,"辰":2,"巳":3,"午":4,"未":5,"申":6,"酉":7,"戌":8,"亥":9,"子":10,"丑":11};
        const mIdx = order[monthZhi];
        const dIdx = order[dayBranch];
        const seq = ["建","除","满","平","定","执","破","危","成","收","开","闭"];
        let offset = (dIdx - mIdx + 12) % 12;
        return seq[offset];
    }
    
    // 获取黄道黑道星君
    function getXingJun(lunarInfo) {
        const monthZhi = lunarInfo.monthZhi;
        const dayZhi = lunarInfo.dayZhi;
        
        const qingLongStartMap = {
            "寅": "寅", "申": "寅",
            "卯": "戌", "酉": "戌",
            "辰": "子", "戌": "子",
            "巳": "午", "亥": "午",
            "子": "申", "午": "申",
            "丑": "寅", "未": "寅"
        };
        
        const qingLongStart = qingLongStartMap[monthZhi];
        if (!qingLongStart) return "未知";
        
        const branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        const xingjunNames = ["青龙","明堂","天刑","朱雀","金匮","天德","白虎","玉堂","天牢","玄武","司命","勾陈"];
        
        const startIdx = branches.indexOf(qingLongStart);
        const dayIdx = branches.indexOf(dayZhi);
        let offset = (dayIdx - startIdx + 12) % 12;
        
        return xingjunNames[offset];
    }
    
    // 获取日紫白星
    function getDayPurpleStar(lunarInfo) {
        const ganList = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
        const zhiList = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        
        const dayGanIdx = ganList.indexOf(lunarInfo.dayGan);
        const dayZhiIdx = zhiList.indexOf(lunarInfo.dayZhi);
        const dayOrder = dayGanIdx * 6 + dayZhiIdx + 1;
        
        const isWinter = (lunarInfo.solarMonth===12 && lunarInfo.solarDay>=21) || 
                        (lunarInfo.solarMonth===1) || 
                        (lunarInfo.solarMonth===2 && lunarInfo.solarDay<19);
        let startNum = isWinter ? 1 : 9;
        let offset = (dayOrder - 1) % 9;
        let star = (startNum + offset - 1) % 9 + 1;
        return star;
    }
    
    // 获取年紫白星
    function getYearPurpleStar(year) {
        let startVal = 9; // 2024年九紫
        let diff = (year - 2024) % 9;
        if (diff < 0) diff += 9;
        let star = startVal - diff;
        if (star <= 0) star += 9;
        return star;
    }
    
    // 综合打分函数
    function calculateWeddingScore(dateInfo, femaleZodiac) {
        let score = 0;
        let details = [];
        let excluded = false;
        let excludeReason = "";
        
        try {
            const solarDate = dateInfo.solarDate;
            const year = solarDate.getFullYear();
            const month = solarDate.getMonth() + 1;
            const day = solarDate.getDate();
            
            // 转换为农历
            const solar = Solar.fromYmdHms(year, month, day, 12, 0, 0);
            const lunar = solar.getLunar();
            
            const lunarInfo = {
                lunarYear: lunar.getYear(),
                lunarMonth: lunar.getMonth(),
                lunarDay: lunar.getDay(),
                yearGanZhi: lunar.getYearInGanZhi(),
                monthGanZhi: lunar.getMonthInGanZhi(),
                dayGanZhi: lunar.getDayInGanZhi(),
                yearGan: lunar.getYearGan(),
                yearZhi: lunar.getYearZhi(),
                monthGan: lunar.getMonthGan(),
                monthZhi: lunar.getMonthZhi(),
                dayGan: lunar.getDayGan(),
                dayZhi: lunar.getDayZhi(),
                jieQiMonthIndex: getJieQiMonthIndex(year, month, day),
                solarYear: year,
                solarMonth: month,
                solarDay: day
            };
            
            // 1. 利月评分 (权重30分)
            const da = daLiMap[femaleZodiac] || [];
            const xiao = xiaoLiMap[femaleZodiac] || [];
            let liYueScore = 0;
            if(da.includes(lunarInfo.lunarMonth)) {
                liYueScore = 30;
                details.push(`✅ 大利月 (+30分)`);
            } else if(xiao.includes(lunarInfo.lunarMonth)) {
                liYueScore = 15;
                details.push(`✔️ 小利月 (+15分)`);
            } else {
                liYueScore = 0;
                details.push(`❌ 非利月 (0分)`);
                excluded = true;
                excludeReason = "不在任何利月内";
            }
            score += liYueScore;
            
            // 如果已被排除，直接返回
            if(excluded) {
                return {
                    totalScore: 0,
                    excluded: true,
                    excludeReason: excludeReason,
                    details: details
                };
            }
            
            // 2. 不将日评分 (权重20分)
            const isBuJiang = isBuJiangDay(lunarInfo);
            let buJiangScore = isBuJiang ? 20 : 0;
            score += buJiangScore;
            details.push(isBuJiang ? `🏮 不将日 (+20分)` : `⚪ 非不将日 (0分)`);
            
            // 3. 建除十二神评分 (权重15分)
            const jianChu = getJianChu(lunarInfo);
            let jianChuScore = 0;
            if(jianChu === "成" || jianChu === "开") {
                jianChuScore = 15;
                details.push(`⭐ ${jianChu}日 (+15分)`);
            } else if(["除", "危", "定", "执"].includes(jianChu)) {
                jianChuScore = 10;
                details.push(`✨ ${jianChu}日 (+10分)`);
            } else if(["建", "满", "平", "收"].includes(jianChu)) {
                jianChuScore = 5;
                details.push(`🔹 ${jianChu}日 (+5分)`);
            } else if(jianChu === "闭") {
                jianChuScore = -10;
                details.push(`⚠️ 闭日 (-10分)`);
            } else if(jianChu === "破") {
                jianChuScore = -20;
                details.push(`❌ 破日 (-20分，直接排除)`);
                excluded = true;
                excludeReason = "破日";
            }
            score += jianChuScore;
            
            // 如果破日排除
            if(excluded) {
                return {
                    totalScore: score,
                    excluded: true,
                    excludeReason: excludeReason,
                    details: details
                };
            }
            
            // 4. 黄黑道评分 (权重15分)
            const xingJun = getXingJun(lunarInfo);
            const isHuangDao = ["青龙", "明堂", "金匮", "天德", "玉堂", "司命"].includes(xingJun);
            let huangDaoScore = isHuangDao ? 15 : 0;
            score += huangDaoScore;
            details.push(isHuangDao ? `🌟 ${xingJun}黄道 (+15分)` : `🌑 ${xingJun}黑道 (0分)`);
            
            // 5. 紫白飞星评分 (权重10分)
            const dayStar = getDayPurpleStar(lunarInfo);
            const yearStar = getYearPurpleStar(lunarInfo.lunarYear);
            let ziBaiScore = 0;
            
            if([1, 6, 8, 9].includes(dayStar)) {
                ziBaiScore = 10;
                details.push(`💫 日紫白${dayStar} (+10分)`);
            } else if([1, 6, 8, 9].includes(yearStar)) {
                ziBaiScore = 5;
                details.push(`✨ 年紫白${yearStar}吉星 (+5分)`);
            } else if([2, 5].includes(dayStar)) {
                ziBaiScore = -5;
                details.push(`⚠️ 日紫白${dayStar}凶星 (-5分)`);
            } else {
                ziBaiScore = 0;
                details.push(`⚪ 无吉凶星 (0分)`);
            }
            score += ziBaiScore;
            
            // 确定等级
            let level = "";
            let levelColor = "";
            if(score >= 70) {
                level = "极品吉日";
                levelColor = "#ff6b6b";
            } else if(score >= 55) {
                level = "上吉";
                levelColor = "#ffa502";
            } else if(score >= 40) {
                level = "中吉";
                levelColor = "#2ed573";
            } else {
                level = "平吉";
                levelColor = "#70a1ff";
            }
            
            return {
                totalScore: score,
                excluded: false,
                level: level,
                levelColor: levelColor,
                details: details,
                jianChu: jianChu,
                xingJun: xingJun,
                isBuJiang: isBuJiang,
                dayStar: dayStar,
                yearStar: yearStar
            };
            
        } catch (e) {
            console.error("打分计算失败:", e);
            return {
                totalScore: 0,
                excluded: true,
                excludeReason: "计算错误",
                details: ["计算出错"]
            };
        }
    }



    // 获取指定日期的农历月份（返回农历月，1-12）
    function getLunarMonth(year, month, day) {
        try {
            if (typeof Lunar !== 'undefined' && typeof Lunar.fromYmd === 'function') {
                const lunar = Lunar.fromYmd(year, month, day);
                return lunar.getMonth();
            }
        } catch (e) {
            console.warn("获取农历月份失败:", e);
        }
        return null;
    }
    
    // 获取日支（使用农历日）
    function getDayZhiFromLunar(lunarYear, lunarMonth, lunarDay) {
        try {
            if (typeof Lunar !== 'undefined' && typeof Lunar.fromYmd === 'function') {
                const lunar = Lunar.fromYmd(lunarYear, lunarMonth, lunarDay);
                const dayInGanZhi = lunar.getDayInGanZhi();
                return dayInGanZhi.charAt(1);
            }
        } catch (e) {
            console.warn("从农历获取日支失败:", e);
        }
        
        // 降级方案：通过公历转换
        try {
            if (typeof Lunar !== 'undefined' && typeof Lunar.fromYmd === 'function') {
                const lunar = Lunar.fromYmd(lunarYear, lunarMonth, lunarDay);
                const solar = lunar.getSolar();
                const date = new Date(solar.getYear(), solar.getMonth() - 1, solar.getDay());
                const baseDate = new Date(2000, 0, 1);
                const diff = Math.floor((date - baseDate) / (24*3600*1000));
                const zhiIndex = (diff + 6) % 12;
                const zhiList = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
                return zhiList[zhiIndex];
            }
        } catch (e) {
            console.warn("降级获取日支失败:", e);
        }
        
        return null;
    }
    
    function getZodiacZhi(zodiac){
        const map = {"鼠":"子","牛":"丑","虎":"寅","兔":"卯","龙":"辰","蛇":"巳","马":"午","羊":"未","猴":"申","鸡":"酉","狗":"戌","猪":"亥"};
        return map[zodiac];
    }
    
    // 四离四绝判断（使用农历节气）
    function isSiLiSiJue(lunarYear, lunarMonth, lunarDay) {
        try {
            if (typeof Lunar !== 'undefined' && typeof Lunar.fromYmd === 'function') {
                const lunar = Lunar.fromYmd(lunarYear, lunarMonth, lunarDay);
                const jieQi = lunar.getJieQi();
                
                // 四离：春分、秋分、夏至、冬至的前一天
                // 四绝：立春、立夏、立秋、立冬的前一天
                const siLiSiJueTerms = ['春分', '秋分', '夏至', '冬至', '立春', '立夏', '立秋', '立冬'];
                
                // 检查当天是否是某个节气
                if (siLiSiJueTerms.includes(jieQi)) {
                    return true;
                }
                
                // 检查前一天是否是节气（即当天是节气前一天）
                const solar = lunar.getSolar();
                const prevDay = solar.next(-1);
                const prevLunar = prevDay.getLunar();
                const prevJieQi = prevLunar.getJieQi();
                
                if (siLiSiJueTerms.includes(prevJieQi)) {
                    return true;
                }
            }
        } catch (e) {
            console.warn("获取节气信息失败:", e);
        }
        
        return false;
    }
    
    // 判断杨公忌，农历的日期
    // 口诀：速记口诀：正月十三、二月十一、三月初九、四月初七、五月初五、六月初三、七月初一、七月廿九、八月廿七、九月廿五、十月廿三、十一月廿一、十二月十九
    function isYangGongJi(lunarMonth, lunarDay) {
        const yangDays = [
            [1,13], [2,11], [3,9], [4,7], [5,5], [6,3], [7,1], [7,29], 
            [8,27], [9,25], [10,23], [11,21], [12,19]
        ];
        for(let [m,d] of yangDays){
            if(m===lunarMonth && d===lunarDay) return true;
        }
        return false;
    }
    
    // 核心婚日判断（全部使用农历日期）- 简化版，只做基本筛选
    function isGoodWeddingDay(lunarYear, lunarMonth, lunarDay, femaleZodiac, maleZodiac, femaleDayNum, maleDayNum) {
        if (!femaleZodiac || !maleZodiac) {
            return false;
        }
        
        // 初一十五回避
        if(lunarDay === 1 || lunarDay === 15) return false;
        
        // 四离四绝
        if(isSiLiSiJue(lunarYear, lunarMonth, lunarDay)) return false;
        
        // 杨公忌
        if(isYangGongJi(lunarMonth, lunarDay)) return false;
        
        // 获取日支
        const dayZhi = getDayZhiFromLunar(lunarYear, lunarMonth, lunarDay);
        if (!dayZhi) return false;
        
        const femaleZhi = getZodiacZhi(femaleZodiac);
        const maleZhi = getZodiacZhi(maleZodiac);
        
        // 冲生肖
        if(liuChong[femaleZhi] === dayZhi) return false;
        if(liuChong[maleZhi] === dayZhi) return false;
        
        // 冲日支
        const femaleDayZhiStr = getDayZhiFromNum(femaleDayNum);
        const maleDayZhiStr = getDayZhiFromNum(maleDayNum);
        if(liuChong[femaleDayZhiStr] === dayZhi || liuChong[maleDayZhiStr] === dayZhi) return false;
        
        // ✅ 新增：男方禁婚年判断
        const yearZhiIndex = (lunarYear - 1900) % 12;
        const yearZhiList = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        const yearZhi = yearZhiList[yearZhiIndex];
        
        // 检查是否为男方禁婚年
        const forbiddenMonths = maleForbiddenYears[maleZodiac] || [];
        if(forbiddenMonths.includes(lunarMonth)) {
            return false;
        }
        
        // ✅ 新增：本命三煞判断
        const sanShaZhis = benMingSanSha[maleZhi] || [];
        if(sanShaZhis.includes(dayZhi)) {
            return false;
        }
        
        // 检查是否为大利月或小利月
        const da = daLiMap[femaleZodiac] || [];
        const xiao = xiaoLiMap[femaleZodiac] || [];
        const isDaLi = da.includes(lunarMonth);
        const isXiaoLi = xiao.includes(lunarMonth);
        
        // 如果不是大/小利月，直接排除
        if(!isDaLi && !isXiaoLi) return false;
        
        // 只要是大/小利月且无冲克，就是候选吉日（后续会打分排序）
        return true;
    }
    
    function getDayZhiFromNum(dayNum){
        const zhiCycle = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        return zhiCycle[(dayNum-1)%12];
    }
    
    // 根据公历年份范围生成吉日（返回农历日期数组，带打分）
    function generateWeddingDatesBySolarRange(startYear, startMonth, startDay, endYear, endMonth, endDay, femaleZodiac, maleZodiac, femaleDayNum, maleDayNum) {
        let allCandidates = [];
        
        const da = daLiMap[femaleZodiac] || [];
        const xiao = xiaoLiMap[femaleZodiac] || [];
        
        try {
            if (typeof Solar === 'undefined' || typeof Solar.fromYmdHms !== 'function') {
                console.error('lunar.js 库未加载');
                return { scored: [], dali: [], xiaoli: [] };
            }
            
            // 遍历每一天
            let currentDate = new Date(startYear, startMonth - 1, startDay);
            const endDate = new Date(endYear, endMonth - 1, endDay);
            
            while (currentDate <= endDate) {
                try {
                    const year = currentDate.getFullYear();
                    const month = currentDate.getMonth() + 1;
                    const day = currentDate.getDate();
                    
                    // 转换为农历（只计算一次）
                    const solar = Solar.fromYmdHms(year, month, day, 12, 0, 0);
                    const lunar = solar.getLunar();
                    const lunarYear = lunar.getYear();
                    const lunarMonth = lunar.getMonth();
                    const lunarDay = lunar.getDay();
                    
                    // 使用农历日期判断基本筛选条件
                    if(isGoodWeddingDay(lunarYear, lunarMonth, lunarDay, femaleZodiac, maleZodiac, femaleDayNum, maleDayNum)) {
                        const dateInfo = {
                            solarDate: new Date(currentDate),
                            lunarYear: lunarYear,
                            lunarMonth: lunarMonth,
                            lunarDay: lunarDay,
                            isDaLi: da.includes(lunarMonth),
                            isXiaoLi: xiao.includes(lunarMonth)
                        };
                        
                        // 计算综合打分
                        const scoreResult = calculateWeddingScore(dateInfo, femaleZodiac);
                        
                        // 只有未被排除的日期才加入候选列表
                        if(!scoreResult.excluded) {
                            dateInfo.score = scoreResult.totalScore;
                            dateInfo.level = scoreResult.level;
                            dateInfo.levelColor = scoreResult.levelColor;
                            dateInfo.scoreDetails = scoreResult.details;
                            dateInfo.jianChu = scoreResult.jianChu;
                            dateInfo.xingJun = scoreResult.xingJun;
                            dateInfo.isBuJiang = scoreResult.isBuJiang;
                            dateInfo.dayStar = scoreResult.dayStar;
                            dateInfo.yearStar = scoreResult.yearStar;
                            
                            allCandidates.push(dateInfo);
                        }
                    }
                } catch (e) {
                    console.warn('处理日期时出错:', currentDate, e);
                }
                
                // 下一天
                currentDate.setDate(currentDate.getDate() + 1);
            }
        } catch (e) {
            console.error('生成吉日失败:', e);
        }
        
        // 按总分从高到低排序
        allCandidates.sort((a,b) => b.score - a.score);
        
        // 分类为大/小利月（用于兼容旧代码）
        const daliCandidates = allCandidates.filter(d => d.isDaLi);
        const xiaoliCandidates = allCandidates.filter(d => d.isXiaoLi);
        
        return {
            scored: allCandidates,  // 所有已打分的候选日期（按分数排序）
            dali: daliCandidates,
            xiaoli: xiaoliCandidates
        };
    }
    
    // 格式化日期显示（公历 + 农历对照）
    function formatDateDisplay(dateInfo, femaleZodiac) {
        const solarDate = dateInfo.solarDate;
        const year = solarDate.getFullYear();
        const month = solarDate.getMonth()+1;
        const day = solarDate.getDate();
        const weekdays = ["周日","周一","周二","周三","周四","周五","周六"];
        const wd = weekdays[solarDate.getDay()];
        
        // 获取农历信息
        let lunarInfo = "";
        try {
            if (typeof Solar !== 'undefined' && typeof Solar.fromYmdHms === 'function') {
                const solar = Solar.fromYmdHms(year, month, day, 12, 0, 0);
                const lunar = solar.getLunar();
                const yearGanZhi = lunar.getYearInGanZhi();
                const lunarMonthStr = lunar.getMonthInChinese();
                const lunarDayStr = lunar.getDayInChinese();
                lunarInfo = `（农历${yearGanZhi}年 ${lunarMonthStr}月${lunarDayStr}）`;
            }
        } catch (e) {
            console.warn("获取农历信息失败:", e);
        }
        
        let monthIsGood = dateInfo.isDaLi ? "🌸 大利月" : (dateInfo.isXiaoLi ? "🌿 小利月" : "");
        return { 
            ymd: `${year}年${month}月${day}日 ${wd}${lunarInfo}`, 
            extra: monthIsGood 
        };
    }
    
    function getReasonText(dateInfo, femaleZodiac, maleZodiac) {
        let parts = [];
        if(dateInfo.isDaLi) parts.push("✅ 值女命「大利月」");
        else if(dateInfo.isXiaoLi) parts.push("✔️ 值女命「小利月」");
        parts.push("📅 黄历宜嫁娶 · 无冲克");
        parts.push("💞 日柱不与双方生肖及日支冲克");
        parts.push("👫 避开男方禁婚月及本命三煞");
        return parts.join("，");
    }
    
    // 渲染结果 - 以日历形式显示大利月和小利月，增加打分显示
    function renderResults(datesData, femaleZodiac, rangeText) {
        const resultDiv = document.getElementById('resultArea');
        const statsPanel = document.getElementById('statsPanel');
        const dateListDiv = document.getElementById('dateList');
        const rangeBadge = document.getElementById('rangeBadge');
        
        const scoredDates = datesData.scored || [];
        const daliDates = datesData.dali || [];
        const xiaoliDates = datesData.xiaoli || [];
        
        if(!scoredDates.length){
            statsPanel.innerHTML = '';
            dateListDiv.innerHTML = '<div class="loading">😢 未筛选到合适婚期，可尝试扩大年份范围或调整出生日参数。</div>';
            resultDiv.style.display = 'block';
            rangeBadge.innerText = rangeText;
            return;
        }
        
        const { maleZodiac } = getCurrentProfile();
        
        // 显示统计信息（独立面板）
        const statsHtml = `
            <div style="background:linear-gradient(135deg, #fff5e6 0%, #ffe8cc 100%); border-radius:20px; padding:15px 20px; border-left:5px solid #ff9800; box-shadow:0 4px 12px rgba(255,152,0,0.15);">
                <h3 style="margin:0 0 10px 0; color:#e65100; font-size:1.1rem;">📊 择日统计</h3>
                <div style="display:flex; flex-wrap:wrap; gap:15px; font-size:0.85rem; color:#6d4c41;">
                    <span>✅ 总计候选：<strong>${scoredDates.length}</strong> 个吉日</span>
                    <span>🌸 大利月：<strong>${daliDates.length}</strong> 个</span>
                    <span>🌿 小利月：<strong>${xiaoliDates.length}</strong> 个</span>
                    <span>🏆 最高分：<strong>${scoredDates[0].score}</strong> 分 (${scoredDates[0].level})</span>
                </div>
            </div>
        `;
        statsPanel.innerHTML = statsHtml;
        
        // 按分数等级分组显示
        const groupedByLevel = {
            "极品吉日": scoredDates.filter(d => d.score >= 70),
            "上吉": scoredDates.filter(d => d.score >= 55 && d.score < 70),
            "中吉": scoredDates.filter(d => d.score >= 40 && d.score < 55),
            "平吉": scoredDates.filter(d => d.score < 40)
        };
        
        let html = '';
        for(let level in groupedByLevel) {
            const levelDates = groupedByLevel[level];
            if(levelDates.length > 0) {
                let bgColor, borderColor, icon;
                switch(level) {
                    case "极品吉日":
                        bgColor = "#fff5f5";
                        borderColor = "#ff6b6b";
                        icon = "🏆";
                        break;
                    case "上吉":
                        bgColor = "#fff9e6";
                        borderColor = "#ffa502";
                        icon = "🌟";
                        break;
                    case "中吉":
                        bgColor = "#f0fff4";
                        borderColor = "#2ed573";
                        icon = "✨";
                        break;
                    default:
                        bgColor = "#f0f8ff";
                        borderColor = "#70a1ff";
                        icon = "📅";
                }
                
                html += `
                    <div style="margin-bottom:30px;">
                        <div style="background:${bgColor}; border-radius:20px; padding:15px 20px; margin-bottom:15px; border-left:5px solid ${borderColor};">
                            <h3 style="margin:0; color:${borderColor}; font-size:1.3rem;">${icon} ${level}（${levelDates.length}个）</h3>
                            <p style="margin:8px 0 0 0; font-size:0.85rem; color:#666;">按综合评分从高到低排列</p>
                        </div>
                        ${renderScoredDateList(levelDates, femaleZodiac, maleZodiac)}
                    </div>
                `;
            }
        }
        
        dateListDiv.innerHTML = html;
        resultDiv.style.display = 'block';
        rangeBadge.innerText = rangeText;
    }
    // 渲染打分后的日期列表
    function renderScoredDateList(dates, femaleZodiac, maleZodiac) {
        if(!dates.length) return '';
        
        let html = '<div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;">';
        
        dates.forEach((dateInfo, index) => {
            const displayInfo = formatDateDisplay(dateInfo, femaleZodiac);
            const reason = getScoredReasonText(dateInfo, femaleZodiac, maleZodiac);
            
            html += `
                <div class="date-card" style="border-left:4px solid ${dateInfo.levelColor}; position:relative;">
                    <div style="position:absolute; top:-8px; right:-8px; background:${dateInfo.levelColor}; color:white; border-radius:50%; width:45px; height:45px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.9rem; box-shadow:0 2px 8px rgba(0,0,0,0.2);">
                        ${dateInfo.score}
                    </div>
                    <strong>${displayInfo.ymd}</strong>
                    <div style="margin-top:8px;">
                        <span class="badge">${displayInfo.extra}</span>
                        <span class="badge" style="background:${dateInfo.levelColor}; color:white;">${dateInfo.level}</span>
                        ${dateInfo.isBuJiang ? '<span class="badge" style="background:#dac29c; color:#6b3a1c; font-weight:bold;">🏮 不将日</span>' : ''}
                        <span class="badge">⭐ ${dateInfo.xingJun}</span>
                        <span class="badge">📅 ${dateInfo.jianChu}日</span>
                        <span class="badge">💫 日紫白${dateInfo.dayStar}</span>
                    </div>
                    <div class="reason">${reason}</div>
                    <div style="margin-top:10px; font-size:0.75rem; color:#999; background:#f9f9f9; padding:8px; border-radius:12px;">
                        <strong>评分详情：</strong><br>
                        ${dateInfo.scoreDetails.join('<br>')}
                    </div>
                </div>
            `;
        });
        
        html += '</div>';
        return html;
    }
    
    function getScoredReasonText(dateInfo, femaleZodiac, maleZodiac) {
        let parts = [];
        if(dateInfo.isDaLi) parts.push("✅ 值女命「大利月」");
        else if(dateInfo.isXiaoLi) parts.push("✔️ 值女命「小利月」");
        parts.push("📅 黄历宜嫁娶 · 无冲克");
        parts.push("💞 日柱不与双方生肖及日支冲克");
        parts.push("👫 避开男方禁婚月及本命三煞");
        parts.push(`🎯 综合评分：${dateInfo.score}分 (${dateInfo.level})`);
        return parts.join("，");
    }
    
    // 获取八字信息
    function getCurrentProfile() {
        const maleYear = parseInt(document.getElementById('maleYear').value);
        const femaleYear = parseInt(document.getElementById('femaleYear').value);
        const maleDayNum = parseInt(document.getElementById('maleDay').value) || 10;
        const femaleDayNum = parseInt(document.getElementById('femaleDay').value) || 5;
        const maleZodiac = getZodiacByYear(maleYear);
        const femaleZodiac = getZodiacByYear(femaleYear);
        return { maleZodiac, femaleZodiac, femaleDayNum, maleDayNum };
    }
    
    // 自定义年份
    function onCustomYear() {
        let selectedYear = parseInt(document.getElementById('selectedYear').value);
        if(isNaN(selectedYear)) {
            const currentYear = new Date().getFullYear();
            selectedYear = currentYear;
            document.getElementById('selectedYear').value = currentYear;
        }
        
        const { maleZodiac, femaleZodiac, femaleDayNum, maleDayNum } = getCurrentProfile();
        const datesData = generateWeddingDatesBySolarRange(selectedYear, 1, 1, selectedYear, 12, 31, femaleZodiac, maleZodiac, femaleDayNum, maleDayNum);
        const rangeText = `📅 公历${selectedYear}年全年`;
        renderResults(datesData, femaleZodiac, rangeText);
    }
    
    // 获取未来一年的吉日（默认显示）
    function onRecentYear() {
        const { maleZodiac, femaleZodiac, femaleDayNum, maleDayNum } = getCurrentProfile();
        const today = new Date();
        const startDate = new Date(today);
        const endDate = new Date(today);
        endDate.setDate(today.getDate() + 365);
        
        const startYear = startDate.getFullYear();
        const startMonth = startDate.getMonth() + 1;
        const startDay = startDate.getDate();
        const endYear = endDate.getFullYear();
        const endMonth = endDate.getMonth() + 1;
        const endDay = endDate.getDate();
        
        const datesData = generateWeddingDatesBySolarRange(startYear, startMonth, startDay, endYear, endMonth, endDay, femaleZodiac, maleZodiac, femaleDayNum, maleDayNum);
        const rangeText = `📅 ${startDate.toLocaleDateString()} 至 ${endDate.toLocaleDateString()} (最近一年)`;
        renderResults(datesData, femaleZodiac, rangeText);
    }
    
    // 下拉填充
    function loadYears() {
        const maleSel = document.getElementById('maleYear');
        const femaleSel = document.getElementById('femaleYear');
        for(let y=1900; y<=2028; y++) {
            let zodiac = getZodiacByYear(y);
            let opt1 = new Option(`${y}年 (${zodiac}年)`, y);
            let opt2 = new Option(`${y}年 (${zodiac}年)`, y);
            if(y===1992) opt1.selected = true;
            if(y===1999) opt2.selected = true;
            maleSel.appendChild(opt1);
            femaleSel.appendChild(opt2);
        }
    }

    // 设置默认年份
     function setDefaultYear() {
        const currentYear = new Date().getFullYear();
        document.getElementById('selectedYear').value = currentYear;
    }
    
    document.getElementById('recentYearBtn').addEventListener('click', onRecentYear);
    document.getElementById('customYearBtn').addEventListener('click', onCustomYear);
    loadYears();
    setDefaultYear();
    
    // 页面加载时自动显示未来一年的吉日
    window.addEventListener('load', function() {
        setTimeout(function() {
            try {
                onRecentYear();
            } catch (e) {
                console.error('自动加载吉日失败:', e);
                document.getElementById('resultArea').style.display = 'block';
                document.getElementById('dateList').innerHTML = 
                    '<div class="loading">⚠️ 初始化失败，请点击按钮重新查询</div>';
            }
        }, 200);
    });
</script>
